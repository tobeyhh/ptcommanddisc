<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProTech Security Solutions | Disciplinary and Commendation Emails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
body[data-theme="navy"]{--hdr:#12233f;--hdr2:#1c3358;--hdrtx:#ffffff;--hdrmu:#b9c4d6;--pri:#12233f;--pri2:#1c3358;--onpri:#ffffff;--paper:#f3f5f8;--panel:#ffffff;--ink:#1b2433;--line:#d9dee6;--steel:#5b6b80;--fbg:#ffffff;--fbd:#c3cad5;--sheet:#ffffff;--sheetink:#1b2433;--head:#12233f;--crimson:#8c2f39;--gold:#b08a35;--tabbg:#ffffff;--tabtx:#12233f;--focus:#1c3358;color-scheme:light}
body[data-theme="red"]{--hdr:#0a0a0a;--hdr2:#1e1e1e;--hdrtx:#ffffff;--hdrmu:#a8a8a8;--pri:#c0262d;--pri2:#d63a41;--onpri:#ffffff;--paper:#121212;--panel:#1a1a1a;--ink:#ececec;--line:#2e2e2e;--steel:#9a9a9a;--fbg:#101010;--fbd:#3a3a3a;--sheet:#0e0e0e;--sheetink:#ececec;--head:#ff6a70;--crimson:#c0262d;--gold:#c9a24a;--tabbg:#c0262d;--tabtx:#ffffff;--focus:#ff6a70;color-scheme:dark}
body[data-theme="gold"]{--hdr:#0a0a0a;--hdr2:#1c1c1c;--hdrtx:#ffffff;--hdrmu:#a89f8a;--pri:#b08a35;--pri2:#c79d3f;--onpri:#111111;--paper:#0f0f0f;--panel:#181818;--ink:#eeeeee;--line:#2c2c2c;--steel:#9d9482;--fbg:#0e0e0e;--fbd:#3a362c;--sheet:#0e0e0e;--sheetink:#eeeeee;--head:#d4af5a;--crimson:#b3414c;--gold:#d4af5a;--tabbg:#b08a35;--tabtx:#111111;--focus:#d4af5a;color-scheme:dark}
body[data-theme="steel"]{--hdr:#2b3138;--hdr2:#3a424b;--hdrtx:#ffffff;--hdrmu:#c3cad1;--pri:#2b3138;--pri2:#3a424b;--onpri:#ffffff;--paper:#eef0f2;--panel:#ffffff;--ink:#1f2429;--line:#d6dadf;--steel:#66707a;--fbg:#ffffff;--fbd:#c4cad0;--sheet:#ffffff;--sheetink:#1f2429;--head:#2b3138;--crimson:#8c2f39;--gold:#a8842f;--tabbg:#ffffff;--tabtx:#2b3138;--focus:#3a424b;color-scheme:light}
body[data-theme="purple"]{--hdr:#120a1f;--hdr2:#231538;--hdrtx:#ffffff;--hdrmu:#b3a6cc;--pri:#7b4fd0;--pri2:#8d63e0;--onpri:#ffffff;--paper:#0f0a18;--panel:#181127;--ink:#ece8f5;--line:#2d2342;--steel:#a094bd;--fbg:#0f0a18;--fbd:#3b2f57;--sheet:#0f0a18;--sheetink:#ece8f5;--head:#b79cf2;--crimson:#c04a6a;--gold:#e8b51a;--tabbg:#7b4fd0;--tabtx:#ffffff;--focus:#b79cf2;color-scheme:dark}
body[data-theme="green"]{--hdr:#0b1f16;--hdr2:#173628;--hdrtx:#ffffff;--hdrmu:#a9c4b4;--pri:#1f7a4d;--pri2:#2a9462;--onpri:#ffffff;--paper:#0e1914;--panel:#15241c;--ink:#e8f1ec;--line:#264236;--steel:#93ae9f;--fbg:#0e1914;--fbd:#34574a;--sheet:#0e1914;--sheetink:#e8f1ec;--head:#5fd195;--crimson:#c0505a;--gold:#d4af5a;--tabbg:#1f7a4d;--tabtx:#ffffff;--focus:#5fd195;color-scheme:dark}
body[data-mode="disciplinary"]{--mode:var(--crimson)}
body[data-mode="commendation"]{--mode:var(--gold)}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
header{background:var(--hdr);color:var(--hdrtx);border-bottom:3px solid var(--mode);transition:border-color .2s}
.bar{max-width:1240px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lockup{display:flex;align-items:center;gap:14px}
.logo{height:46px;width:auto;display:block}
.brand h1{margin:0;font:600 19px/1.2 var(--sans);letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:13px;color:var(--hdrmu)}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.themepick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--hdrmu);margin:0;font-weight:400}
.themepick select{width:auto;background:var(--hdr2);color:var(--hdrtx);border:1px solid transparent;padding:7px 10px;font-size:14px}
.switch{display:inline-flex;background:var(--hdr2);border-radius:6px;padding:3px}
.switch button{border:0;background:transparent;color:var(--hdrmu);font:500 14px var(--sans);padding:8px 18px;border-radius:4px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--tabbg);color:var(--tabtx)}
main{max-width:1240px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.panel>h2{margin:0;padding:14px 20px;font:600 15px var(--sans);border-bottom:1px solid var(--line);color:var(--head)}
fieldset{border:0;margin:0;padding:18px 20px;border-bottom:1px solid var(--line)}
fieldset:last-of-type{border-bottom:0}
legend{float:left;width:100%;padding:0 0 12px;font:600 13px var(--sans);color:var(--steel)}
legend+*{clear:both}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:500;margin:0 0 4px}
.fld{margin-bottom:12px}
.fld:last-child{margin-bottom:0}
input[type=text],input[type=date],select,textarea{width:100%;font:15px var(--sans);color:var(--ink);background:var(--fbg);border:1px solid var(--fbd);border-radius:4px;padding:9px 10px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.hint{font-size:12px;color:var(--steel);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;font-weight:400}
.chips input{position:absolute;opacity:0}
.chips span{display:inline-block;padding:6px 12px;border:1px solid var(--fbd);border-radius:999px;cursor:pointer;font-size:13px;background:var(--fbg)}
.chips input:checked+span{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.chips input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.check{display:flex;gap:8px;align-items:center;font-weight:400}
.only-d,.only-c{display:none}
body[data-mode="disciplinary"] .only-d{display:block}
body[data-mode="commendation"] .only-c{display:block}
.preview{position:sticky;top:16px}
@media(max-width:900px){.preview{position:static}}
.sheet{margin:20px;padding:28px 30px;background:var(--sheet);color:var(--sheetink);border:1px solid var(--line);border-top:4px solid var(--mode);min-height:320px;font:16px/1.65 var(--serif);transition:border-color .2s}
.sheet .h{font-weight:600;color:var(--head)}
.mh,.mb{white-space:pre-wrap}
.mh{font:14px/1.7 var(--sans);padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.mh b{display:inline-block;min-width:68px;color:var(--steel);font-weight:500}
.actions{display:flex;gap:10px;align-items:center;padding:0 20px 20px;flex-wrap:wrap}
.btn{border:1px solid var(--pri);background:var(--pri);color:var(--onpri);font:500 14px var(--sans);padding:10px 20px;border-radius:4px;cursor:pointer}
.btn:hover{background:var(--pri2);border-color:var(--pri2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--fbd)}
.btn.ghost:hover{background:var(--paper)}
.status{font-size:13px;color:var(--steel)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-mode="disciplinary" data-theme="navy">

<header>
  <div class="bar">
    <div class="lockup">
      <img class="logo" id="logo" src="logo.png" alt="ProTech Security Solutions logo" onerror="this.style.display='none'">
      <div class="brand">
        <h1>ProTech Security Solutions</h1>
        <p>Disciplinary and Commendation Email Generator</p>
      </div>
    </div>
    <div class="tools">
      <label class="themepick">Theme
        <select id="theme" aria-label="Theme">
          <option value="navy">Corporate Navy</option>
          <option value="red">Red and Black</option>
          <option value="gold">Black and Gold</option>
          <option value="steel">Steel Grey</option>
          <option value="purple">Royal Purple</option>
          <option value="green">Forest Green</option>
        </select>
      </label>
      <div class="switch" role="group" aria-label="Notice type">
        <button type="button" id="m-d" aria-pressed="true">Disciplinary</button>
        <button type="button" id="m-c" aria-pressed="false">Commendation</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="panel" aria-label="Notice details">
    <h2>Email details</h2>

    <fieldset>
      <legend>Employee</legend>
      <div class="fld"><label for="emp">Employee name</label><input type="text" id="emp" placeholder="e.g. Jordan Reyes"></div>
      <div class="row">
        <div class="fld"><label for="empRank">Employee rank</label><select id="empRank"></select></div>
        <div class="fld"><label for="div">Division</label><select id="div"></select><div class="hint">Choosing a rank fills in its division.</div></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Issued by</legend>
      <div class="row">
        <div class="fld"><label for="iss">Issuer name</label><select id="iss"></select></div>
        <div class="fld"><label for="issPos">Issuer rank</label><select id="issPos"></select></div>
      </div>
      <div class="fld"><label for="date">Effective date</label><input type="date" id="date"><div class="hint">Shown in the notice as DD/MM/YYYY.</div></div>
    </fieldset>

    <!-- Disciplinary -->
    <div class="only-d">
      <fieldset>
        <legend>Disciplinary action</legend>
        <div class="row">
          <div class="fld"><label for="dType">Type of action</label>
            <select id="dType">
              <option>Verbal Warning</option>
              <option selected>Written Warning</option>
              <option>Final Written Warning</option>
              <option>Suspension</option>
              <option>Demotion</option>
              <option>Termination of Employment</option>
            </select></div>
          <div class="fld" id="durWrap" style="display:none"><label for="dur">Suspension duration</label><input type="text" id="dur" placeholder="e.g. 7 days"></div>
          <div class="fld"><label for="dDate">Date of incident</label><input type="date" id="dDate"></div>
        </div>
        <div class="fld"><label for="dDesc">Incident summary</label><textarea id="dDesc" placeholder="State what happened, factually and without opinion."></textarea></div>
        <div class="row">
          <div class="fld"><label for="dPolSel">Policy or handbook</label><select id="dPolSel"></select></div>
          <div class="fld"><label for="dPol">Section or details (optional)</label><input type="text" id="dPol" placeholder="e.g. Section 4.2, or the policy name if Other"></div>
        </div>
        <div class="fld"><label for="dPrev">Previous action (optional)</label><textarea id="dPrev" style="min-height:60px" placeholder="Earlier warnings or counselling on record."></textarea></div>
      </fieldset>
      <fieldset>
        <legend>Expectations and consequences</legend>
        <div class="fld"><label for="dExp">Corrective expectations</label><textarea id="dExp" placeholder="What must change, and by when."></textarea></div>
        <div class="fld"><label for="dCons">Consequences of further violations</label><textarea id="dCons" style="min-height:60px" placeholder="e.g. Further violations may result in escalated disciplinary action."></textarea></div>
        <div class="fld"><label for="dFin">Final comments (optional)</label><textarea id="dFin" style="min-height:60px"></textarea></div>
        <div class="fld"><label class="check"><input type="checkbox" id="dAck"> Ask the employee to reply to confirm receipt</label></div>
      </fieldset>
    </div>

    <!-- Commendation -->
    <div class="only-c">
      <fieldset>
        <legend>Commendation</legend>
        <div class="row">
          <div class="fld"><label for="cType">Type of recognition</label>
            <select id="cType">
              <option selected>Commendation</option>
              <option>Letter of Appreciation</option>
              <option>Exemplary Service Award</option>
              <option>Outstanding Achievement Award</option>
            </select></div>
          <div class="fld"><label for="cDate">Date of the act</label><input type="date" id="cDate"></div>
        </div>
        <div class="fld"><label for="cDesc">Reason for recognition</label><textarea id="cDesc" placeholder="Describe what the employee did and the situation they handled."></textarea></div>
        <div class="fld"><label>Values demonstrated</label>
          <div class="chips" id="vals">
            <label><input type="checkbox" value="Professionalism"><span>Professionalism</span></label>
            <label><input type="checkbox" value="Initiative"><span>Initiative</span></label>
            <label><input type="checkbox" value="Teamwork"><span>Teamwork</span></label>
            <label><input type="checkbox" value="Leadership"><span>Leadership</span></label>
            <label><input type="checkbox" value="Integrity"><span>Integrity</span></label>
            <label><input type="checkbox" value="Dedication"><span>Dedication</span></label>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Impact and recognition</legend>
        <div class="fld"><label for="cImp">Impact on the company</label><textarea id="cImp" placeholder="What this meant for clients, colleagues or operations."></textarea></div>
        <div class="row">
          <div class="fld"><label for="cRewSel">Recognition awarded (optional)</label><select id="cRewSel"></select></div>
          <div class="fld"><label for="cRew">Details (optional)</label><input type="text" id="cRew" placeholder="e.g. amount, or the recognition if Other"></div>
        </div>
        <div class="fld"><label for="cFin">Final comments (optional)</label><textarea id="cFin" style="min-height:60px"></textarea></div>
      </fieldset>
    </div>
  </section>

  <section class="panel preview" aria-label="Live preview">
    <h2>Email preview</h2>
    <div class="sheet" id="sheet" aria-live="polite"></div>
    <div class="actions">
      <button type="button" class="btn" id="copySub">Copy subject</button>
      <button type="button" class="btn" id="copyBody">Copy body</button>
      <button type="button" class="btn ghost" id="clear">Clear form</button>
      <span class="status" id="status" role="status"></span>
    </div>
  </section>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var mode = 'disciplinary', missing = false, st = {head:[],subject:'',body:'',heads:[]};

  function val(id){return $(id).value.trim()}
  function req(id,label){var x=val(id); if(!x){missing=true; return '['+label+']'} return x}
  function fmt(d){if(!d) return ''; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]}
  function reqDate(id,label){var d=fmt($(id).value); if(!d){missing=true; return '['+label+']'} return d}
  function art(w){return /^[aeiou]/i.test(w)?'an':'a'}
  function list(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1]}
  function end(s){s=s.trim(); return /[.!?]$/.test(s)?s:s+'.'}

  // ===== EDIT HERE: divisions, ranks and tags =====
  // Each division lists its ranks as [rank name, tag]. Add, remove or rename freely.
  var DIVISIONS = [
    {name:'Executive Command', ranks:[['Chief Executive Officer','EXEC-CEO'],['Chief Operating Officer','EXEC-COO'],['Director of Operations','EXEC-DIR']]},
    {name:'Cash-In-Transit Division', ranks:[['Division Director','CIT-DIR'],['Deputy Director','CIT-DEP'],['Team Leader','CIT-TL'],['Senior Officer','CIT-SO'],['Security Officer','CIT-OFC'],['Trainee','CIT-TRN']]},
    {name:'Technical Services Division', ranks:[['Division Director','TSD-DIR'],['Deputy Director','TSD-DEP'],['Senior Technician','TSD-ST'],['Technician','TSD-TEC'],['Trainee Technician','TSD-TRN']]},
    {name:'Training and Recruitment', ranks:[['Head of Training','TRN-HOT'],['Field Training Instructor','TRN-FTI'],['Recruitment Officer','TRN-REC']]},
    {name:'Human Resources', ranks:[['HR Director','HR-DIR'],['HR Officer','HR-OFC']]}
  ];
  // Policies, handbooks and recognition options shown in the dropdowns ("Other" is added automatically).
  var POLICIES = ['Code of Conduct','Attendance and Punctuality Policy','Uniform and Appearance Policy','Equipment Use Policy','Client Confidentiality Policy','Chain of Command Policy'];
  // Issuers shown in the Issuer dropdown.
  var ISSUERS = ['Dominic Gallagher','Vanessa Kovacs','Adrian Cooper','Calvin Redmond','Tyler Walker'];
  var REWARDS = ['Entry on the employee record','Commendation bonus','Consideration for promotion','Public recognition'];
  // ================================================

  function opt(parent,text,value,disabled){var o=document.createElement('option');o.textContent=text;o.value=value==null?text:value;if(disabled)o.disabled=true;parent.appendChild(o);return o}
  function fillRanks(id,placeholder){
    var sel=$(id); opt(sel,placeholder,'');
    DIVISIONS.forEach(function(d,i){
      if(i>0) opt(sel,'\u00a0','',true);
      var g=document.createElement('optgroup'); g.label=d.name;
      d.ranks.forEach(function(r,j){opt(g,r[0]+' ('+r[1]+')',i+'|'+j)});
      sel.appendChild(g);
    });
  }
  function fillList(id,placeholder,items){
    var sel=$(id); opt(sel,placeholder,'');
    items.concat(['Other']).forEach(function(t){opt(sel,t)});
  }
  function fillIssuers(){
    var sel=$('iss'); opt(sel,'Select issuer','');
    ISSUERS.forEach(function(n){opt(sel,n)});
  }
  function fillDivisions(){
    var sel=$('div'); opt(sel,'Select division','');
    DIVISIONS.forEach(function(d){opt(sel,d.name)});
  }
  function rankInfo(id){
    var v=$(id).value; if(!v) return null;
    var p=v.split('|'), d=DIVISIONS[p[0]], r=d.ranks[p[1]];
    return {rank:r[0],tag:r[1],div:d.name};
  }
  function roleLine(prefix,role,dv){
    if(role) return ' '+prefix+' as '+role+(dv?' in the '+dv:'')+'.';
    if(dv) return ' '+prefix+' in the '+dv+'.';
    return '';
  }
  function pick(selId,textId){
    var s=val(selId), t=val(textId);
    if(!s) return '';
    if(s==='Other') return t;
    return s+(t?', '+t:'');
  }
  function need(id,label){return val(id)?end(val(id)):(missing=true,'['+label+']')}

  function build(){
    missing=false;
    var emp=req('emp','Employee Name'), iss=req('iss','Issuer Name'),
        ir=rankInfo('issPos'), er=rankInfo('empRank'), ip=ir?ir.rank+' ('+ir.tag+')':'', idv=ir?ir.div:'', role=er?er.rank+' ('+er.tag+')':'', dv=val('div'),
        eff=reqDate('date','DD/MM/YYYY'), secs=[], lead, subject, closing='';

    if(mode==='disciplinary'){
      var type=$('dType').value;
      var dur=(type==='Suspension'&&val('dur'))?' for a period of '+val('dur'):'';
      subject='Disciplinary Notice: '+type+' ('+emp+')';
      lead='This email serves as formal notice that you are being issued '+art(type)+' '+type+dur+', effective '+eff+'.'+roleLine('This notice applies to your role',role,dv);
      var dd=fmt($('dDate').value); if(!dd) missing=true;
      secs.push(['Incident Summary','On '+(dd||'[Date of Incident]')+', '+need('dDesc','Incident Summary')]);
      var pol=pick('dPolSel','dPol'); secs.push(['Policy Reference',pol?end('This conduct is addressed under '+pol):(missing=true,'[Policy Reference]')]);
      if(val('dPrev')) secs.push(['Previous Action',end(val('dPrev'))]);
      secs.push(['Corrective Expectations',need('dExp','Corrective Expectations')]);
      if(val('dCons')) secs.push(['Consequences of Further Violations',end(val('dCons'))]);
      if(val('dFin')) secs.push(['Final Comments',end(val('dFin'))]);
      if($('dAck').checked) closing='Please reply to this email to confirm that you have received and understood this notice.';
    } else {
      var ct=$('cType').value;
      subject=(ct==='Commendation'?'Commendation Notice':ct)+' ('+emp+')';
      lead='On behalf of ProTech Security Solutions, I am pleased to inform you that you are being awarded '+art(ct)+' '+ct+', effective '+eff+'.'+roleLine('This recognition applies to your service',role,dv);
      var cd=fmt($('cDate').value); if(!cd) missing=true;
      secs.push(['Reason for Recognition','On '+(cd||'[Date of the Act]')+', '+need('cDesc','Reason for Recognition')]);
      var vs=[].map.call(document.querySelectorAll('#vals input:checked'),function(i){return i.value.toLowerCase()});
      if(vs.length) secs.push(['Values Demonstrated',end('You demonstrated '+list(vs)+' in the performance of your duties')]);
      if(val('cImp')) secs.push(['Impact on the Company',end(val('cImp'))]);
      var rew=pick('cRewSel','cRew'); if(rew) secs.push(['Recognition Awarded',end(rew)]);
      if(val('cFin')) secs.push(['Final Comments',end(val('cFin'))]);
      closing='Thank you for your continued commitment to ProTech Security Solutions.';
    }

    var body='Dear '+emp+',\n\n'+lead+'\n\n'+
      secs.map(function(x){return x[0]+'\n'+x[1]}).join('\n\n')+
      (closing?'\n\n'+closing:'')+
      '\n\nKind regards,\n'+iss+(ip?'\n'+ip:'')+(idv?'\n'+idv:'')+'\nProTech Security Solutions';

    st.head=[['Subject',subject]];
    st.subject=subject; st.body=body; st.heads=secs.map(function(x){return x[0]});
    render();
  }

  function render(){
    var sheet=$('sheet'); sheet.textContent='';
    var mh=document.createElement('div'); mh.className='mh';
    st.head.forEach(function(h,i){
      var b=document.createElement('b'); b.textContent=h[0];
      mh.appendChild(b); mh.appendChild(document.createTextNode(h[1]+(i<st.head.length-1?'\n':'')));
    });
    var mb=document.createElement('div'); mb.className='mb';
    var lines=st.body.split('\n');
    lines.forEach(function(line,i){
      if(st.heads.indexOf(line)>-1){
        var s=document.createElement('span'); s.className='h'; s.textContent=line; mb.appendChild(s);
      } else mb.appendChild(document.createTextNode(line));
      if(i<lines.length-1) mb.appendChild(document.createTextNode('\n'));
    });
    sheet.appendChild(mh); sheet.appendChild(mb);
  }

  function setMode(m){
    mode=m; document.body.setAttribute('data-mode',m);
    $('m-d').setAttribute('aria-pressed',m==='disciplinary');
    $('m-c').setAttribute('aria-pressed',m==='commendation');
    $('status').textContent=''; build();
  }

  function setStatus(t){
    $('status').textContent=t;
    clearTimeout(setStatus.t); setStatus.t=setTimeout(function(){$('status').textContent=''},3500);
  }

  function copy(getText,label){
    build();
    var text=getText();
    var done=function(){setStatus(missing?label+' copied. Some fields are still blank.':label+' copied.')};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done,function(){fallback(text,done)});
    } else fallback(text,done);
  }
  function fallback(text,done){
    var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select();
    try{document.execCommand('copy'); done()}catch(e){setStatus('Copy failed. Select the preview text and copy it manually.')}
    document.body.removeChild(t);
  }

  fillRanks('empRank','Select rank'); fillRanks('issPos','Select rank'); fillIssuers(); fillDivisions();
  fillList('dPolSel','Select policy',POLICIES); fillList('cRewSel','Select recognition',REWARDS);
  $('empRank').addEventListener('change',function(){var r=rankInfo('empRank'); if(r) $('div').value=r.div});

  $('m-d').onclick=function(){setMode('disciplinary')};
  $('m-c').onclick=function(){setMode('commendation')};
  $('dType').addEventListener('change',function(){$('durWrap').style.display=this.value==='Suspension'?'block':'none'});
  document.querySelector('main').addEventListener('input',build);
  document.querySelector('main').addEventListener('change',build);
  $('copySub').onclick=function(){copy(function(){return st.subject},'Subject')};
  $('copyBody').onclick=function(){copy(function(){return st.body},'Body')};

  $('clear').onclick=function(){
    if(!confirm('Clear every field in this form?')) return;
    document.querySelectorAll('main input[type=text],main input[type=date],main textarea').forEach(function(e){e.value=''});
    document.querySelectorAll('main input[type=checkbox]').forEach(function(e){e.checked=false});
    $('dType').selectedIndex=1; $('cType').selectedIndex=0; ['empRank','div','iss','issPos','dPolSel','cRewSel'].forEach(function(id){$(id).selectedIndex=0}); $('durWrap').style.display='none';
    setDefaultDate(); build(); setStatus('Form cleared.');
  };

  function setDefaultDate(){
    var d=new Date(), z=function(n){return String(n).padStart(2,'0')};
    $('date').value=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
  }
  function setTheme(t,save){
    document.body.setAttribute('data-theme',t); $('theme').value=t;
    if(save){try{localStorage.setItem('protech-theme',t)}catch(e){}}
  }
  $('theme').addEventListener('change',function(){setTheme(this.value,true)});
  var saved=null; try{saved=localStorage.getItem('protech-theme')}catch(e){}
  if(saved&&$('theme').querySelector('option[value="'+saved+'"]')) setTheme(saved,false);

  setDefaultDate(); build();
})();
</script>
</body>
</html>
